name: BillMaker
options:
  bundleIdPrefix: com.billmaker
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"

packages:
  AgentAtom:
    url: https://github.com/abhi266raj/AgentAtom.git
    exactVersion: 0.1.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    PRODUCT_NAME: "BillMaker"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  BillMaker:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/BillMaker
        excludes:
          - Info.plist
    dependencies:
      - package: AgentAtom
        product: AgentAtomSource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billmaker.app
        INFOPLIST_FILE: Sources/BillMaker/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
        CODE_SIGN_ENTITLEMENTS: ""

  BillMakerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/BillMakerTests
    dependencies:
      - target: BillMaker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.billmaker.tests
        PRODUCT_MODULE_NAME: BillMakerTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BillMaker.app/Contents/MacOS/BillMaker"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: false
    sources:
      - path: Tests/BillMakerTests
    dependencies:
      - target: BillMaker
